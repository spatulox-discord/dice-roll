# Read from the default branch only. The second npm entry is what makes
# feat/multi-bot get its own PRs (its package.json differs: concurrently
# plus the per-bot launch scripts).
version: 2

updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    ignore:
      # @types/node tracks the Node.js majors. CI runs on 22.x and 24.x, so the
      # types stay pinned on the lowest runtime we support: a bump to 26 would
      # let tsc accept APIs that do not exist at run time. Bump this by hand the
      # day the ci.yml matrix drops Node 22.
      - dependency-name: '@types/node'
        update-types: [version-update:semver-major]
    # One PR per group instead of one per package
    groups:
      production:
        dependency-type: production
        update-types: [minor, patch]
      development:
        dependency-type: development
        update-types: [minor, patch]
    commit-message:
      prefix: "chore(deps)"
      prefix-development: "chore(dev-deps)"

  - package-ecosystem: npm
    directory: /
    target-branch: feat/multi-bot
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    # Same pin as the main block above: the two branches share the ci.yml matrix
    ignore:
      - dependency-name: '@types/node'
        update-types: [version-update:semver-major]
    groups:
      production:
        dependency-type: production
        update-types: [minor, patch]
      development:
        dependency-type: development
        update-types: [minor, patch]
    commit-message:
      prefix: "chore(deps)"
      prefix-development: "chore(dev-deps)"
    labels: [dependencies, multi-bot]

  # Keeps actions/checkout & actions/setup-node current in the workflows above
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    commit-message:
      prefix: "chore(ci)"
